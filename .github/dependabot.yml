# Dependabot configuration.
# Docs: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # New releases mature before a PR is opened; security updates bypass
    # the cooldown automatically.
    cooldown:
      default-days: 14
    groups:
      # One batched PR per week instead of one PR per action.
      github-actions:
        patterns:
          - "*"
