name: Diagnose winget submit 422

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  submit:
    name: Submit ${{ matrix.package }}
    runs-on: windows-2025
    environment: Production
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: Storj.Uplink
            version: 1.161.9
          - package: Snyk.Snyk
            version: 1.1306.4
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download original manifest artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ matrix.version }}
        run: |
          gh run download 31729787682 `
            --repo "$env:GITHUB_REPOSITORY" `
            --name "manifest__$env:PACKAGE`__$env:VERSION" `
            --dir ./downloaded-manifests

      - name: Submit exact original manifest
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_PAT }}
          WINGET_UPSTREAM_READ_TOKEN: ${{ secrets.WINGET_PAT }}
          WINGET_UPSTREAM_READ_FALLBACK_TOKEN: ${{ github.token }}
          WINGET_PKGS_FORK_REPO: ${{ vars.WINGET_PKGS_FORK_REPO }}
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ matrix.version }}
        run: |
          Import-Module .\modules\WingetMaintainerModule\WingetMaintainerModule.psd1 -Force

          $result = Submit-WingetPackage `
            -ManifestPath ./downloaded-manifests `
            -PackageId "$env:PACKAGE" `
            -Version "$env:VERSION" `
            -With ForkBranch `
            -SubmissionTarget Upstream `
            -Repository microsoft/winget-pkgs

          if (-not $result.Success) {
            throw "Submission failed: $($result.Error)"
          }

          Write-Host "Created PR: $($result.PrUrl)"
