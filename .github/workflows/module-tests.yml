name: Module tests

on:
  pull_request:
    paths:
      - ".github/workflows/module-tests.yml"
      - "modules/WingetMaintainerModule/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/module-tests.yml"
      - "modules/WingetMaintainerModule/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  package-state:
    name: Package state (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run regression tests
        shell: pwsh
        run: |
          ./tests/Save-PackageState.Tests.ps1
          ./tests/Update-WingetPackage.Tests.ps1
          ./tests/GitHubApiCache.Tests.ps1
          ./tests/SubmissionWorkflowAuthorization.Tests.ps1
          Invoke-Pester ./tests/Submit-WingetPackage.Tests.ps1 -EnableExit
