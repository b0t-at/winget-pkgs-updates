name: Orchestrate GH Packages
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - github-releases-monitored.yml
jobs:
    update-package-count:
        runs-on: ubuntu-latest

        permissions:
            contents: write
        steps:
            - name: create App token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              id: app-token
              with:
                client-id: ${{ secrets.APP_ID }}
                private-key: ${{ secrets.PRIVATE_KEY }}
                permission-contents: write
            - name: Check out code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                token: ${{ steps.app-token.outputs.token }}
                persist-credentials: true
            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                python-version: '3.x'
            - name: Install dependencies
              run: pip install pyyaml
            - name: Count packages
              id: count
              run: |
                python3 scripts/orchestrate_gh-packages.py
                git status
            - name: Commit and push
              uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
              with:
                commit_message: Update package count badge
                file_pattern: .github/workflows-data/update-github-packages-*.packages.json
