name: Orchestrate GH Packages
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - github-releases-monitored.yml
jobs:
    update-package-count:
        runs-on: ubuntu-latest

        permissions:
            contents: write
        steps:
            - name: create App token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              id: app-token
              with:
                client-id: ${{ secrets.APP_ID }}
                private-key: ${{ secrets.PRIVATE_KEY }}
                permission-contents: write
            - name: Check out code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                token: ${{ steps.app-token.outputs.token }}
                persist-credentials: true
            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                python-version: '3.x'
            - name: Install dependencies
              run: pip install pyyaml ruamel.yaml
            - name: Count packages
              id: count
              run: |
                python3 scripts/orchestrate_gh-packages.py
                git status
            - name: Commit and push
              uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
              with:
                commit_message: Update package count badge
                file_pattern: |
                  .github/workflows/update-github-packages-*.yml
                  .github/workflows-data/update-github-packages-*.packages.json
