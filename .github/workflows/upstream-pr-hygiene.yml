name: Upstream PR Hygiene

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only; do not close anything"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "41 6 * * *" # daily, 06:41 UTC

permissions: {}

concurrency:
  group: upstream-pr-hygiene
  cancel-in-progress: false

jobs:
  record-winmatsch-feedback:
    name: Record WinMatsch feedback
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.record.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify upstream PR verdicts
        id: record
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_PAT }}
          WINMATSCH_TOKEN: ${{ secrets.WINGET_PAT }}
          WINMATSCH_FEEDBACK_RETENTION_DAYS: 30
        run: |
          try {
            Import-Module ./modules/WingetMaintainerModule/WingetMaintainerModule.psd1 -Force
            Install-WinMatsch

            $feedbackDirectory = Join-Path $env:RUNNER_TEMP 'winmatsch-feedback'
            Remove-Item -LiteralPath $feedbackDirectory -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $feedbackDirectory -Force | Out-Null

            $committedFeedbackDirectory = Join-Path $env:GITHUB_WORKSPACE 'data/winmatsch-feedback'
            if (Test-Path -LiteralPath $committedFeedbackDirectory -PathType Container) {
              Get-ChildItem -LiteralPath $committedFeedbackDirectory -Force |
                Copy-Item -Destination $feedbackDirectory -Recurse -Force
            }

            try {
              $retentionDays = [int]$env:WINMATSCH_FEEDBACK_RETENTION_DAYS
              Remove-StaleWinMatschFeedback -FeedbackDirectory $feedbackDirectory -RetentionDays $retentionDays | Format-Table -AutoSize
            }
            catch {
              Write-Warning "WinMatsch feedback pruning failed; keeping existing feedback fail-safe: $($_.Exception.Message)"
            }

            $env:WINMATSCH_FEEDBACK_DIRECTORY = $feedbackDirectory
            & winmatsch complete `
              --fork damn-good-b0t/winget-pkgs `
              --branch-prefix winget-autosubmit/ `
              --schedule-pending `
              --yes `
              --interaction never `
              --token $env:WINMATSCH_TOKEN
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              Write-Warning "WinMatsch feedback recording failed with exit code $exitCode; skipping feedback artifact upload."
              "artifact=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
            }

            Get-ChildItem -LiteralPath $feedbackDirectory -Filter '*.lock' -File -ErrorAction SilentlyContinue |
              Remove-Item -Force
            # Not a dotfile: upload-artifact skips hidden files by default.
            Set-Content -LiteralPath (Join-Path $feedbackDirectory 'artifact-ready.txt') -Value 'true' -NoNewline
            "artifact=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          catch {
            Write-Warning "WinMatsch feedback recording failed: $($_.Exception.Message); skipping feedback artifact upload."
            "artifact=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

      - name: Upload WinMatsch feedback artifact
        if: steps.record.outputs.artifact == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winmatsch-feedback
          path: ${{ runner.temp }}/winmatsch-feedback
          retention-days: 1
          if-no-files-found: error

  persist-winmatsch-feedback:
    name: Persist WinMatsch feedback
    needs: record-winmatsch-feedback
    if: needs.record-winmatsch-feedback.outputs.artifact == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: package-state-write
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Download WinMatsch feedback artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: winmatsch-feedback
          path: ./winmatsch-feedback-artifact

      - name: Save WinMatsch feedback state
        shell: pwsh
        run: |
          Import-Module ./modules/WingetMaintainerModule/WingetMaintainerModule.psd1 -Force

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          Save-WinMatschFeedbackState `
            -FeedbackSourcePath ./winmatsch-feedback-artifact `
            -RepoPath $env:GITHUB_WORKSPACE

  sweep:
    name: Sweep superseded upstream PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Closes this bot's own open upstream PRs that are superseded by a newer
      # open PR or whose version is already published; everything else is only
      # reported (grouped by validation labels) in the job summary.
      - name: Sweep open upstream PRs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_PAT }}
          WINGET_UPSTREAM_READ_TOKEN: ${{ secrets.WINGET_PAT }}
          WINGET_PKGS_FORK_REPO: ${{ vars.WINGET_PKGS_FORK_REPO }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: ./scripts/Invoke-UpstreamPrHygiene.ps1
